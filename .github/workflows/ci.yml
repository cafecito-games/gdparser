name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch push and its pull request would otherwise each run the suite on the
# same commit, and a follow-up push would race the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
